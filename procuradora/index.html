<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Plazos</title>
<meta name="description" content="Agenda de plazos procesales para procuradores: sube la notificación de LexNET y calcula el vencimiento en días hábiles.">
<meta name="theme-color" content="#2A2C66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#C5C7EA; --surf:#E4E5F4; --card:#EBECF8; --ink:#25264F; --muted:#585B8B; --soft:#8E91BE; --line:rgba(88,91,160,.14);
  --deep1:#3A3D86; --deep2:#24255A; --deep3:#17183C; --on-deep:#F1F2FF; --on-deep-muted:#B4B7E6;
  --acc:#5A5FE0; --acc2:#8F94F7; --red:#E8445F; --amber:#E8962A; --green:#1FA878; --gray:#8F92B8;
  --sh-d:rgba(112,116,182,.42); --sh-l:rgba(255,255,255,.92);
  --neu:9px 9px 20px var(--sh-d),-9px -9px 20px var(--sh-l);
  --neu-sm:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l);
  --neu-in:inset 4px 4px 10px var(--sh-d),inset -4px -4px 10px var(--sh-l);
  --fab:linear-gradient(150deg,#F4F4FF,#D9DAF2); --fab-sh:8px 10px 22px rgba(80,84,160,.42),-6px -6px 16px rgba(255,255,255,.9),inset 0 2px 0 #fff;
  --r:26px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0E0F25; --surf:#1A1B3B; --card:#212347; --ink:#ECEDFF; --muted:#A9ACDA; --soft:#7F82B5; --line:rgba(160,164,240,.14);
  --deep1:#30327A; --deep2:#1C1D4A; --deep3:#121331; --sh-d:rgba(4,5,20,.62); --sh-l:rgba(92,96,180,.16); color-scheme:dark;
  --red:#FF5C77; --amber:#F5A742; --green:#2CC48E;
  --fab:linear-gradient(150deg,#34377A,#1B1C48); --fab-sh:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
}}
:root[data-theme="dark"]{
  --page:#0E0F25; --surf:#1A1B3B; --card:#212347; --ink:#ECEDFF; --muted:#A9ACDA; --soft:#7F82B5; --line:rgba(160,164,240,.14);
  --deep1:#30327A; --deep2:#1C1D4A; --deep3:#121331; --sh-d:rgba(4,5,20,.62); --sh-l:rgba(92,96,180,.16); color-scheme:dark;
  --red:#FF5C77; --amber:#F5A742; --green:#2CC48E;
  --fab:linear-gradient(150deg,#34377A,#1B1C48); --fab-sh:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--page);
  background-image:radial-gradient(circle at 12% 40%,rgba(255,255,255,.22) 0 30%,transparent 30.2%);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{flex:none}
.phone{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--surf);position:relative;overflow:clip;display:flex;flex-direction:column}
@media (min-width:560px){.phone{margin:28px auto;min-height:calc(100dvh - 56px);border-radius:46px;box-shadow:0 30px 70px rgba(40,42,110,.28),0 0 0 10px rgba(255,255,255,.35)}}
main{flex:1}

/* ---------- parte oscura (cabecera) con la curva ---------- */
.hero{position:relative;background:linear-gradient(165deg,var(--deep1) 0%,var(--deep2) 55%,var(--deep3) 100%);color:var(--on-deep);
  padding:calc(env(safe-area-inset-top) + 14px) 22px 76px}
.hero.compact{padding-bottom:62px}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:64px;display:block}
.wave path{fill:var(--surf)}
.wave-up{display:block;width:100%;height:58px;margin-top:10px;margin-bottom:-1px}
.wave-up path{fill:var(--deep2)}
.topbar{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;height:56px}
.ibtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--on-deep)}
.ibtn:active{background:rgba(255,255,255,.08)}
.notch{justify-self:center;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.28)}
.tb-title{justify-self:center;font-weight:800;font-size:1.05rem;text-align:center;line-height:1.2}
.hello{margin:14px 2px 0;font-size:.95rem;color:var(--on-deep-muted);font-weight:700}
.hello b{display:block;color:var(--on-deep);font-size:1.6rem;font-weight:900;letter-spacing:-.01em;margin-top:2px}
.search{margin:16px 0 0;display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;border-radius:25px;
  background:rgba(8,9,30,.32);box-shadow:inset 2px 2px 6px rgba(0,0,0,.35),inset -1px -1px 0 rgba(255,255,255,.08);color:var(--on-deep-muted)}
.search input{flex:1;border:0;outline:0;background:none;color:var(--on-deep);font-weight:600;min-width:0}
.search input::placeholder{color:var(--on-deep-muted)}
.glass{margin-top:18px;border-radius:28px;padding:20px;position:relative;
  background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);
  box-shadow:0 16px 32px rgba(5,6,30,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.glass .row{display:flex;gap:14px;align-items:center}
.gicon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(150deg,#1F2050,#121331);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px rgba(0,0,0,.3)}
.glass h2{margin:0;font-size:1.75rem;font-weight:900;letter-spacing:-.01em}
.glass p{margin:2px 0 0;color:var(--on-deep-muted);font-weight:700;font-size:.92rem}
.gbar{margin-top:18px;height:9px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#6E73FF,#A3A7FF);box-shadow:0 0 12px rgba(130,135,255,.8)}
.gcap{text-align:right;margin-top:8px;font-size:.8rem;color:var(--on-deep-muted);font-weight:700}

/* ---------- parte clara ---------- */
.sec{padding:6px 22px 18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px;color:var(--muted);font-weight:800;font-size:.95rem}
.sec-h .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:1px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tile .tb{width:100%;aspect-ratio:1;max-width:96px;border-radius:28px;display:grid;place-items:center;background:var(--card);box-shadow:var(--neu);transition:box-shadow .2s,transform .2s;position:relative}
.tile.on .tb{box-shadow:var(--neu-in)}
.tile:active .tb{transform:scale(.97)}
.tile .tl{font-weight:800;font-size:.98rem;line-height:1.1}
.tile .ts{color:var(--soft);font-weight:700;font-size:.8rem;margin-top:-6px}
.cnt{position:absolute;top:-6px;right:-6px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;color:#fff;font-weight:900;font-size:.85rem;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.18)}

.pcard{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 14px 14px 14px;margin-bottom:16px;border-radius:var(--r);background:var(--card);box-shadow:var(--neu-sm)}
.pcard:active{box-shadow:var(--neu-in)}
.badge{width:60px;height:60px;border-radius:20px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1}
.badge b{font-size:1.45rem;font-weight:900}
.badge span{font-size:.68rem;font-weight:800;opacity:.92;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.b-vencido,.b-gracia,.b-hoy{background:linear-gradient(150deg,#FF8297,#E23A5A);box-shadow:0 8px 16px rgba(226,58,90,.32)}
.b-pronto{background:linear-gradient(150deg,#FFC069,#EC8A1C);box-shadow:0 8px 16px rgba(236,138,28,.3)}
.b-tiempo{background:linear-gradient(150deg,#55E0AE,#159C70);box-shadow:0 8px 16px rgba(21,156,112,.28)}
.b-hecho{background:linear-gradient(150deg,#B6B9DD,#8A8DB8)}
.pc-main{flex:1;min-width:0}
.pc-t{font-weight:900;font-size:1.05rem;line-height:1.2}
.pc-s{color:var(--muted);font-weight:700;font-size:.86rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-v{font-weight:800;font-size:.86rem;margin-top:5px}
.t-vencido,.t-gracia,.t-hoy{color:var(--red)} .t-pronto{color:var(--amber)} .t-tiempo{color:var(--green)} .t-hecho{color:var(--soft)}
.chev{color:var(--soft)}
.pcard.hecho .pc-t{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}

.empty{text-align:center;padding:26px 16px 10px;color:var(--muted);font-weight:700}
.empty h3{color:var(--ink);font-size:1.25rem;margin:14px 0 6px;font-weight:900}
.linkbtn{display:block;margin:6px auto 0;padding:12px 18px;color:var(--acc);font-weight:800}

/* ---------- barra inferior con el botón central ---------- */
#navwrap{position:sticky;bottom:0;z-index:30}
.nav{display:grid;grid-template-columns:1fr 132px 1fr;height:calc(78px + env(safe-area-inset-bottom));margin-top:auto;filter:drop-shadow(0 -6px 14px var(--sh-d))}
.nav .side{background:var(--card);display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
.nav .side.l{border-top-left-radius:30px}.nav .side.r{border-top-right-radius:30px}
.nav .mid{position:relative}
.nav .mid svg.cut{position:absolute;inset:0 0 auto 0;width:132px;height:100%}
.nav .mid svg.cut path{fill:var(--card)}
.nav.dark .side{background:var(--deep3)} .nav.dark .mid svg.cut path{fill:var(--deep3)}
.nav.dark{filter:drop-shadow(0 -6px 14px rgba(0,0,0,.35))}
.navb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft);font-weight:800;font-size:.75rem;min-width:72px;padding:4px}
.navb.on{color:var(--acc)} .nav.dark .navb{color:#7D80B8} .nav.dark .navb.on{color:#C9CBFF}
.navb .pip{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0}.navb.on .pip{opacity:1}
.fab{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  background:var(--fab);box-shadow:var(--fab-sh)}
.nav.dark .fab{background:linear-gradient(150deg,#2B2D66,#17183C);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab-l{position:absolute;left:0;right:0;top:50px;text-align:center;font-weight:900;font-size:.78rem;color:var(--acc)}
.nav.dark .fab-l{color:#C9CBFF}

/* ---------- formularios ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--neu-sm);padding:18px;margin-bottom:18px}
.card h3{margin:0 0 4px;font-size:1.12rem;font-weight:900}
.card .sub{margin:0 0 12px;color:var(--muted);font-weight:600;font-size:.9rem;line-height:1.4}
.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;margin-right:8px;color:#fff;font-weight:900;font-size:.9rem;background:linear-gradient(150deg,var(--acc2),var(--acc));vertical-align:2px}
label.lb{display:block;font-weight:800;font-size:.92rem;margin:14px 2px 7px}
label.lb small{display:block;color:var(--muted);font-weight:600;font-size:.82rem;margin-top:2px}
.inp{width:100%;height:54px;border:0;outline:0;border-radius:18px;padding:0 16px;background:var(--surf);box-shadow:var(--neu-in);font-weight:700;font-size:1rem}
textarea.inp{height:auto;min-height:96px;padding:14px 16px;line-height:1.45;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat}
.inp:focus{box-shadow:var(--neu-in),0 0 0 3px rgba(90,95,224,.35)}
.seg{display:flex;padding:5px;border-radius:20px;background:var(--surf);box-shadow:var(--neu-in);gap:4px}
.seg button{flex:1;min-height:46px;border-radius:15px;font-weight:800;color:var(--muted);font-size:.92rem;padding:0 6px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--neu-sm)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .rb{width:54px;height:54px;border-radius:18px;background:var(--card);box-shadow:var(--neu-sm);display:grid;place-items:center;color:var(--acc);font-size:1.6rem;font-weight:900}
.stepper .rb:active{box-shadow:var(--neu-in)}
.stepper .inp{text-align:center;font-size:1.5rem;font-weight:900;width:96px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:10px 14px;border-radius:16px;background:var(--card);box-shadow:var(--neu-sm);font-weight:800;font-size:.86rem;line-height:1.2;text-align:left}
.chip small{display:block;color:var(--muted);font-weight:700;font-size:.76rem}
.chip.on{box-shadow:var(--neu-in);color:var(--acc)}
.switch{display:flex;align-items:center;gap:14px;padding:6px 2px;text-align:left;width:100%}
.switch .tog{width:58px;height:34px;border-radius:17px;background:var(--surf);box-shadow:var(--neu-in);position:relative;flex:none;transition:background .2s}
.switch .tog::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--card);box-shadow:2px 2px 6px var(--sh-d);transition:transform .2s}
.switch.on .tog{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.switch.on .tog::after{transform:translateX(24px);background:#fff}
.switch b{display:block;font-weight:800}
.switch small{color:var(--muted);font-weight:600;font-size:.82rem;line-height:1.35;display:block}

.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 16px;border-radius:24px;background:var(--surf);box-shadow:var(--neu-in);width:100%;position:relative}
.drop b{font-size:1.05rem;font-weight:900}
.drop small{color:var(--muted);font-weight:700}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.found{margin-top:14px;padding:14px 16px;border-radius:18px;background:rgba(31,168,120,.12);color:var(--ink);font-weight:600;font-size:.9rem;line-height:1.45}
.found b{color:var(--green)}
.found q{quotes:none;display:block;margin-top:6px;font-style:italic;color:var(--muted)}
.warn{padding:14px 16px;border-radius:18px;background:rgba(232,150,42,.14);font-weight:700;font-size:.88rem;line-height:1.45}
.warn b{color:var(--amber)}
.err{background:rgba(232,68,95,.12)}
.err b{color:var(--red)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:20px;font-weight:900;font-size:1.05rem;color:#fff;
  background:linear-gradient(150deg,#6C71F0,#3E42B8);box-shadow:0 12px 24px rgba(70,74,200,.38),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:scale(.98)}
.btn.green{background:linear-gradient(150deg,#46D7A2,#139769);box-shadow:0 12px 24px rgba(19,151,105,.32)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:var(--neu-sm)}
.btn.soft:active{box-shadow:var(--neu-in)}
.btn.danger{background:none;box-shadow:none;color:var(--red);min-height:48px;font-size:.95rem}
.btn+.btn{margin-top:14px}

/* ---------- resultado del cálculo ---------- */
.result{border-radius:28px;padding:20px;color:var(--on-deep);background:linear-gradient(160deg,var(--deep1),var(--deep3));box-shadow:0 18px 32px rgba(30,32,90,.35);margin-bottom:18px}
.result .k{font-size:.78rem;font-weight:900;letter-spacing:.12em;color:var(--on-deep-muted);text-transform:uppercase}
.result .big{font-size:1.65rem;font-weight:900;line-height:1.15;margin:4px 0 6px}
.result .g{color:var(--on-deep-muted);font-weight:700;font-size:.9rem;line-height:1.4}
.result .g b{color:#fff}
.result details{margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.result summary{cursor:pointer;font-weight:800;color:#C9CBFF;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px}
.result summary::-webkit-details-marker{display:none}
.tl{margin:10px 0 0;padding:0;list-style:none;position:relative}
.tl li{position:relative;padding:0 0 12px 30px;font-weight:700;font-size:.9rem;line-height:1.35}
.tl li::before{content:"";position:absolute;left:7px;top:6px;width:10px;height:10px;border-radius:50%;background:#8F94F7}
.tl li::after{content:"";position:absolute;left:11px;top:18px;bottom:-2px;width:2px;background:rgba(255,255,255,.12)}
.tl li:last-child::after{display:none}
.tl li.salto{color:var(--on-deep-muted)} .tl li.salto::before{background:transparent;border:2px dashed #7D80B8}
.tl li.vence::before{background:#FF8297;box-shadow:0 0 0 4px rgba(255,130,151,.25)}
.tl li.gracia::before{background:#FFC069}
.tl small{display:block;color:var(--on-deep-muted);font-weight:600}
.cmp{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,192,105,.14);color:#FFE2B8;font-weight:700;font-size:.86rem;line-height:1.45}

/* ---------- ficha de un plazo ---------- */
.count{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 16px;border-radius:20px;font-weight:900;font-size:.95rem;color:#fff}
.count.c-tiempo{background:rgba(31,168,120,.85)} .count.c-pronto{background:rgba(236,138,28,.9)} .count.c-hoy,.count.c-gracia,.count.c-vencido{background:rgba(232,58,90,.9)} .count.c-hecho{background:rgba(255,255,255,.18)}
.d-title{font-size:1.55rem;font-weight:900;line-height:1.2;margin:10px 0 0}
.d-when{margin-top:8px;color:var(--on-deep-muted);font-weight:700;line-height:1.4}
.d-when b{color:#fff}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:4px 0 22px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:.78rem;text-align:center;line-height:1.15}
.act .ab{width:100%;aspect-ratio:1;max-width:72px;border-radius:22px;background:var(--card);box-shadow:var(--neu-sm);display:grid;place-items:center}
.act:active .ab{box-shadow:var(--neu-in)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:0;font-size:.95rem}
.dl dt{color:var(--muted);font-weight:700}
.dl dd{margin:0;font-weight:800;word-break:break-word}

/* ---------- calendario ---------- */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mhead h2{margin:0;font-size:1.35rem;font-weight:900}
.rbtn{width:48px;height:48px;border-radius:16px;background:var(--card);box-shadow:var(--neu-sm);display:grid;place-items:center;color:var(--acc)}
.rbtn:active{box-shadow:var(--neu-in)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.grid .wd{font-size:.75rem;font-weight:900;color:var(--soft);padding-bottom:4px}
.day{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;position:relative}
.day.inh{color:var(--soft);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 7px)}
.day.today{box-shadow:inset 0 0 0 2px var(--acc)}
.day.sel{background:linear-gradient(150deg,#6C71F0,#3E42B8);color:#fff;box-shadow:0 8px 16px rgba(70,74,200,.35)}
.day .dots{display:flex;gap:3px;position:absolute;bottom:5px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 2px 0;color:var(--muted);font-weight:700;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px}

<script>
'use strict';
const VERSION = 'v1.0';
// Dirección pública de la app instalable (GitHub Pages). Si cambia el repositorio, cambiar aquí.
const APP_URL = 'https://ai-phi-design.github.io/PHI.BET/procuradora/';

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- fechas: siempre 'AAAA-MM-DD' y cálculos en UTC (sin saltos por cambio de hora) ---------- */
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const DIAS_C = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const pad = n => String(n).padStart(2, '0');
const toD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fromD = dt => dt.toISOString().slice(0, 10);
const addDias = (s, n) => fromD(new Date(toD(s).getTime() + n * 864e5));
const hoy = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const partes = s => { const d = toD(s); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: d.getUTCDay() }; };
const fLarga = s => { const p = partes(s); return `${DIAS[p.w]}, ${p.d} de ${MESES[p.m - 1]}`; };
const fLargaY = s => { const p = partes(s); return `${DIAS[p.w]}, ${p.d} de ${MESES[p.m - 1]} de ${p.y}`; };
const fCorta = s => { const p = partes(s); return `${DIAS_C[p.w]} ${p.d} ${MESES_C[p.m - 1]}`; };
const fNum = s => { const p = partes(s); return `${pad(p.d)}/${pad(p.m)}/${p.y}`; };
const may = s => s.charAt(0).toUpperCase() + s.slice(1);
const validFecha = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(toD(s));

/* ---------- días inhábiles ---------- */
// Domingo de Pascua (algoritmo anónimo gregoriano)
function pascua(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return `${y}-${pad(mes)}-${pad(dia)}`;
}
// Festivos nacionales comunes a toda España
function nacionales(y) {
  return [[`${y}-01-01`, 'Año Nuevo'], [`${y}-01-06`, 'Reyes'], [addDias(pascua(y), -2), 'Viernes Santo'], [`${y}-05-01`, 'Fiesta del Trabajo'],
    [`${y}-08-15`, 'Asunción de la Virgen'], [`${y}-10-12`, 'Fiesta Nacional de España'], [`${y}-11-01`, 'Todos los Santos'],
    [`${y}-12-06`, 'Día de la Constitución'], [`${y}-12-08`, 'Inmaculada Concepción'], [`${y}-12-25`, 'Navidad']];
}
const cacheNac = {};
const nacionalDe = s => { const y = s.slice(0, 4); if (!cacheNac[y]) cacheNac[y] = new Map(nacionales(+y)); return cacheNac[y].get(s); };
// Devuelve por qué un día es inhábil ('' si es hábil).
// urgente = asunto en el que agosto y del 24 dic al 6 ene sí cuentan (art. 183 LOPJ, salvo urgentes).
function inhabil(s, urgente) {
  const p = partes(s);
  if (!urgente && p.m === 8) return 'agosto';
  if (!urgente && ((p.m === 12 && p.d >= 24) || (p.m === 1 && p.d <= 6))) return 'Navidad (24 dic – 6 ene)';
  if (p.m === 12 && (p.d === 24 || p.d === 31)) return p.d + ' de diciembre';
  if (p.w === 6 || p.w === 0) return 'fin de semana';
  const n = nacionalDe(s); if (n) return n;
  const f = S.festivos.find(x => x.fecha === s); if (f) return f.nombre || 'festivo';
  return '';
}
const sigHabil = (s, urg, seq) => { let d = addDias(s, 1); while (inhabil(d, urg)) { if (seq) seq.push({ k: 'salto', fecha: d, motivo: inhabil(d, urg) }); d = addDias(d, 1); } return d; };
const habilesEntre = (a, b, urg) => { let n = 0, d = a; while (d < b) { d = addDias(d, 1); if (!inhabil(d, urg)) n++; } return n; };

/* ---------- el cálculo del plazo ----------
   1. Recepción en LexNET. Si llega después de las 15:00 o en día inhábil, cuenta como recibida el día hábil siguiente.
   2. Se entiende notificada el día hábil siguiente a la recepción (art. 151.2 LEC).
   3. El plazo empieza al día siguiente de la notificación (art. 133.1 LEC).
      · Por días: se cuentan solo los hábiles (art. 133.2 LEC; agosto y 24 dic – 6 ene inhábiles, art. 183 LOPJ).
      · Por meses: de fecha a fecha (art. 133.3 LEC); si acaba en inhábil, pasa al siguiente hábil.
   4. Día de gracia: se puede presentar hasta las 15:00 del día hábil siguiente al vencimiento (art. 135.5 LEC). */
function calcular(p) {
  const urg = !!p.urgente, seq = [];
  const cant = Math.max(1, Math.floor(Number(p.cantidad) || 0));
  if (!validFecha(p.recepcion)) return null;
  seq.push({ k: 'rec', fecha: p.recepcion, tarde: p.hora === 'despues' });
  let rec = p.recepcion;
  if (inhabil(rec, urg) || p.hora === 'despues') {
    if (inhabil(rec, urg)) seq.push({ k: 'salto', fecha: rec, motivo: inhabil(rec, urg) });
    rec = sigHabil(rec, urg, seq);
    seq.push({ k: 'recEf', fecha: rec, porHora: p.hora === 'despues' && !inhabil(p.recepcion, urg) });
  }
  const notificada = sigHabil(rec, urg, seq);
  seq.push({ k: 'not', fecha: notificada });
  let vence;
  if (p.unidad === 'meses') {
    const q = partes(notificada);
    const mesFin = new Date(Date.UTC(q.y, q.m - 1 + cant + 1, 0)).getUTCDate();
    const t = new Date(Date.UTC(q.y, q.m - 1 + cant, Math.min(q.d, mesFin)));
    vence = fromD(t);
    seq.push({ k: 'mes', fecha: vence, n: cant });
    while (inhabil(vence, urg)) { seq.push({ k: 'salto', fecha: vence, motivo: inhabil(vence, urg) }); vence = addDias(vence, 1); }
  } else {
    let d = notificada, n = 0;
    while (n < cant) { d = addDias(d, 1); const m = inhabil(d, urg); if (m) seq.push({ k: 'salto', fecha: d, motivo: m }); else { n++; seq.push({ k: 'dia', fecha: d, n }); } }
    vence = d;
  }
  const gracia = sigHabil(vence, urg);
  seq.push({ k: 'vence', fecha: vence }, { k: 'gracia', fecha: gracia });
  const saltaVacaciones = seq.some(x => x.k === 'salto' && (x.motivo === 'agosto' || x.motivo.startsWith('Navidad')));
  return { recibida: rec, notificada, vence, gracia, seq, cant, saltaVacaciones };
}
// Agrupa el paso a paso para enseñarlo sin una lista de 20 líneas
function agrupar(seq) {
  const out = [];
  for (const x of seq) {
    const last = out[out.length - 1];
    if (x.k === 'dia' && last && last.k === 'dias' && addDias(last.hasta, 1) === x.fecha) { last.hasta = x.fecha; last.n2 = x.n; continue; }
    if (x.k === 'dia') { out.push({ k: 'dias', desde: x.fecha, hasta: x.fecha, n1: x.n, n2: x.n }); continue; }
    if (x.k === 'salto' && last && last.k === 'saltos' && last.motivo === x.motivo && addDias(last.hasta, 1) === x.fecha) { last.hasta = x.fecha; continue; }
    if (x.k === 'salto') { out.push({ k: 'saltos', desde: x.fecha, hasta: x.fecha, motivo: x.motivo }); continue; }
    out.push(x);
  }
  return out;
}
const rango = (a, b) => a === b ? fCorta(a) : `${fCorta(a)} – ${fCorta(b)}`;
function pasosHTML(c, p) {
  return `<ol class="tl">${agrupar(c.seq).map(x => {
    switch (x.k) {
      case 'rec': return `<li>Llega a LexNET: <b>${fCorta(x.fecha)}</b>${x.tarde ? ' (después de las 15:00)' : ''}</li>`;
      case 'recEf': return `<li>Cuenta como recibida: <b>${fCorta(x.fecha)}</b><small>${x.porHora ? 'Llegó después de las 15:00' : 'Llegó en día inhábil'}</small></li>`;
      case 'not': return `<li>Se entiende notificada: <b>${fCorta(x.fecha)}</b><small>Día hábil siguiente a la recepción</small></li>`;
      case 'dias': return `<li>${x.n1 === x.n2 ? `Día ${x.n1}` : `Días ${x.n1} a ${x.n2}`} del plazo: <b>${rango(x.desde, x.hasta)}</b></li>`;
      case 'saltos': return `<li class="salto">No cuenta: ${rango(x.desde, x.hasta)}<small>${esc(x.motivo)}</small></li>`;
      case 'mes': return `<li>${x.n} ${x.n === 1 ? 'mes' : 'meses'} de fecha a fecha: <b>${fCorta(x.fecha)}</b></li>`;
      case 'vence': return `<li class="vence">Vence: <b>${fCorta(x.fecha)}</b></li>`;
      case 'gracia': return `<li class="gracia">Aún se puede presentar hasta las 15:00 del <b>${fCorta(x.fecha)}</b><small>Día de gracia (art. 135.5 LEC)</small></li>`;
    }
    return '';
  }).join('')}</ol>`;
}

/* ---------- estado de cada plazo ---------- */
// vencido · gracia (hoy hasta 15:00) · hoy · pronto (≤ 3 días hábiles) · tiempo · hecho
function estado(p, c) {
  c = c || calcular(p); const t = hoy();
  if (p.hecho) return { k: 'hecho', n: 0, c };
  if (!c) return { k: 'tiempo', n: 0, c };
  if (t > c.gracia) return { k: 'vencido', n: 0, c };
  if (t > c.vence) return { k: 'gracia', n: 0, c };
  if (t === c.vence) return { k: 'hoy', n: 0, c };
  const n = habilesEntre(t, c.vence, p.urgente);
  return { k: n <= 3 ? 'pronto' : 'tiempo', n, c };
}
const textoEstado = e => ({
  hecho: 'Hecho', vencido: `Vencido el ${e.c ? fCorta(e.c.vence) : ''}`, gracia: 'Hoy hasta las 15:00 (día de gracia)', hoy: 'Vence HOY',
  pronto: e.n === 1 ? 'Queda 1 día hábil' : `Quedan ${e.n} días hábiles`, tiempo: `Quedan ${e.n} días hábiles`
})[e.k];
const badgeHTML = e => {
  const inner = { hecho: '<b>✓</b><span>hecho</span>', vencido: '<b>!</b><span>vencido</span>', gracia: '<b>15h</b><span>gracia</span>', hoy: '<b>HOY</b>' }[e.k]
    || `<b>${e.n}</b><span>${e.n === 1 ? 'día' : 'días'}</span>`;
  return `<div class="badge b-${e.k}">${inner}</div>`;
};
const COLOR = { vencido: 'var(--red)', gracia: 'var(--red)', hoy: 'var(--red)', pronto: 'var(--amber)', tiempo: 'var(--green)', hecho: 'var(--gray)' };

/* ---------- almacenamiento en el propio móvil (IndexedDB) ---------- */
const Store = (() => {
  const hasIDB = typeof indexedDB !== 'undefined';
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('mis-plazos', 1);
    r.onupgradeneeded = e => { const d = e.target.result; d.createObjectStore('plazos', { keyPath: 'id' }); d.createObjectStore('kv'); d.createObjectStore('pdfs'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const ls = { get: k => { try { return JSON.parse(localStorage.getItem('mp:' + k) || 'null'); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem('mp:' + k, JSON.stringify(v)); } catch { toast('No queda espacio para guardar'); } } };
  if (!hasIDB) return {
    all: async () => ls.get('plazos') || [], put: async p => { const a = (ls.get('plazos') || []).filter(x => x.id !== p.id); a.push(p); ls.set('plazos', a); },
    del: async id => ls.set('plazos', (ls.get('plazos') || []).filter(x => x.id !== id)),
    getKV: async k => ls.get(k), setKV: async (k, v) => ls.set(k, v), getPDF: async () => null, putPDF: async () => {}, delPDF: async () => {}
  };
  return {
    all: () => tx('plazos', 'readonly', s => s.getAll()),
    put: p => tx('plazos', 'readwrite', s => s.put(p)),
    del: id => tx('plazos', 'readwrite', s => s.delete(id)),
    getKV: k => tx('kv', 'readonly', s => s.get(k)),
    setKV: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)),
    getPDF: id => tx('pdfs', 'readonly', s => s.get(id)),
    putPDF: (id, v) => tx('pdfs', 'readwrite', s => s.put(v, id)),
    delPDF: id => tx('pdfs', 'readwrite', s => s.delete(id))
  };
})();

/* ---------- estado de la app ---------- */

/* ---------- navegación con historial (botón atrás del móvil) ---------- */
function go(view, replace) { closeOverlay(); S.view = view; if (replace) history.replaceState(view, ''); else history.pushState(view, ''); render(); window.scrollTo(0, 0); }
window.addEventListener('popstate', e => { closeOverlay(); S.view = e.state || { name: 'home' }; render(); });
const back = () => { if (history.state && history.state.name !== 'home' && history.length > 1) history.back(); else go({ name: 'home' }, true); };

/* ---------- pantallas ---------- */
function render() {
  const v = S.view, app = $('#app');
  const views = { home: vHome, nuevo: vNuevo, plazo: vPlazo, calendario: vCalendario, abogados: vAbogados, festivos: vFestivos, perfil: vPerfil, ayuda: vAyuda, copia: vCopia };
  if (v.name === 'plazo' && !findPlazo(v.id)) { S.view = { name: 'home' }; return render(); }
  app.innerHTML = (views[v.name] || vHome)();
  $('#navwrap').innerHTML = (v.name === 'home' || v.name === 'calendario') ? navHTML(v.name) : '';
  if (v.name === 'nuevo') pintaCalculo();
  if (v.name === 'calendario') { const s = $('.pill.sel'); if (s) s.scrollIntoView({ block: 'nearest', inline: 'center' }); }
}
function navHTML(on) {
  return `<nav class="nav${on === 'calendario' ? ' dark' : ''}" aria-label="Menú principal">
    <div class="side l"><button class="navb${on === 'home' ? ' on' : ''}" data-go="home">${I.home}<span>Inicio</span><i class="pip"></i></button></div>
    <div class="mid"><svg class="cut" viewBox="0 0 132 78" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 C22 0 26 6 30 16 C38 38 50 46 66 46 C82 46 94 38 102 16 C106 6 110 0 132 0 V78 H0 Z"/></svg>

    <div class="side r"><button class="navb${on === 'calendario' ? ' on' : ''}" data-go="calendario">${I.cal}<span>Calendario</span><i class="pip"></i></button></div>
  </nav>`;
}
function topbar(title, opts = {}) {
  const left = opts.menu ? `<button class="ibtn" data-act="menu" aria-label="Menú">${I.menu}</button>` : `<button class="ibtn" data-act="back" aria-label="Volver">${I.back}</button>`;
  const mid = title ? `<div class="tb-title">${esc(title)}</div>` : `<div class="notch">${I.logo(30)}</div>`;
  return `<div class="topbar">${left}${mid}${opts.right || '<span></span>'}</div>`;
}
const saludo = () => { const h = new Date().getHours(); return h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches'; };
const coincide = (p, q) => !q || [p.actuacion, p.organo, p.procedimiento, p.cliente, p.nig, (findAbogado(p.abogadoId) || {}).nombre].join(' ').toLowerCase().includes(q.toLowerCase());

function vHome() {
  const lista = S.plazos.map(p => ({ p, e: estado(p) })).filter(x => coincide(x.p, S.query));
  const pend = lista.filter(x => x.e.k !== 'hecho').sort((a, b) => (a.e.c ? a.e.c.vence : '9') < (b.e.c ? b.e.c.vence : '9') ? -1 : 1);
  const grupo = k => pend.filter(x => k.includes(x.e.k));
  const gHoy = grupo(['vencido', 'gracia', 'hoy']), gPronto = grupo(['pronto']), gTiempo = grupo(['tiempo']);
  const hechos = lista.filter(x => x.e.k === 'hecho').sort((a, b) => (b.p.hechoEn || 0) - (a.p.hechoEn || 0));
  // barra de la semana: de lo que vence en los próximos 7 días naturales, cuánto está hecho
  const t = hoy(), fin = addDias(t, 7);
  const semana = S.plazos.map(p => ({ p, c: calcular(p) })).filter(x => x.c && x.c.vence >= t && x.c.vence <= fin);
  const hechosSem = semana.filter(x => x.p.hecho).length;
  const pctSem = semana.length ? Math.round(hechosSem * 100 / semana.length) : 100;
  const prox = pend.find(x => x.e.c && x.e.k !== 'vencido');
  const nombre = (S.perfil.nombre || '').trim().split(/\s+/)[0];
  const tile = (k, icon, label, n, color) => `<button class="tile${S.filtro === k ? ' on' : ''}" data-act="filtro" data-k="${k}" aria-pressed="${S.filtro === k}">
      <div class="tb">${icon}${n ? `<span class="cnt" style="background:${color}">${n}</span>` : ''}</div><div class="tl">${label}</div><div class="ts">${n === 1 ? '1 plazo' : n + ' plazos'}</div></button>`;
  const seccion = (titulo, color, items) => items.length ? `<div class="sec-h"><span><i class="dot" style="background:${color}"></i>${titulo}</span><span>${items.length}</span></div>${items.map(x => cardHTML(x.p, x.e)).join('')}` : '';
  let cuerpo;
  if (!S.plazos.length) cuerpo = `<div class="empty"><div style="color:var(--acc)">${I.empty}</div><h3>Aún no hay plazos</h3>Pulsa el botón <b>+ Nueva</b> de abajo para añadir tu primera notificación.<br>Puedes subir el PDF de LexNET y yo leo los datos.</div>`;
  else {
    const f = S.filtro;
    cuerpo = (!f || f === 'hoy' ? seccion('Hoy y vencidos', 'var(--red)', gHoy) : '') + (!f || f === 'pronto' ? seccion('Próximos días', 'var(--amber)', gPronto) : '') + (!f || f === 'tiempo' ? seccion('Con tiempo', 'var(--green)', gTiempo) : '');
    if (!cuerpo) cuerpo = `<div class="empty">${S.query ? 'No encuentro nada con esa búsqueda.' : 'Nada en este grupo. ¡Bien!'}</div>`;
    if (hechos.length && !f) cuerpo += S.verHechos ? seccion('Hechos', 'var(--gray)', hechos) + `<button class="linkbtn" data-act="verHechos">Ocultar los hechos</button>` : `<button class="linkbtn" data-act="verHechos">Ver los hechos (${hechos.length})</button>`;
  }
  return `<section class="hero">
    ${topbar('', { menu: true, right: `<button class="ibtn" data-go="ayuda" aria-label="Cómo se cuentan los plazos">${I.info.replace('width="28" height="28"', 'width="30" height="30"')}</button>` })}
    <p class="hello">${saludo()}${nombre ? ',' : ''}<b>${nombre ? esc(nombre) : 'Tu agenda de plazos'}</b></p>
    <label class="search">${I.search}<span class="sr">Buscar</span><input id="q" type="search" placeholder="Buscar juzgado, número o cliente…" value="${esc(S.query)}" autocomplete="off"></label>
    <div class="glass">
      <div class="row"><div class="gicon">${I.doc(34)}</div><div><h2>Mis plazos</h2><p>${pend.length === 1 ? '1 pendiente' : pend.length + ' pendientes'}${prox ? (prox.e.c.vence <= hoy() ? ' · hay que mirar uno hoy' : ` · el próximo, ${fCorta(prox.e.c.vence)}`) : ''}</p></div></div>
      <div class="gbar"><i style="width:${pctSem}%"></i></div>
      <div class="gcap">${semana.length ? `Esta semana: ${hechosSem} de ${semana.length} hechos` : 'No vence nada en los próximos 7 días'}</div>
    </div>
    ${waveSVG()}
  </section>
  <section class="sec">
    <div class="tiles">
      ${tile('hoy', I.tHoy, 'Hoy', gHoy.length, 'var(--red)')}
      ${tile('pronto', I.tPronto, 'Próximos', gPronto.length, 'var(--amber)')}
      ${tile('tiempo', I.tTiempo, 'Con tiempo', gTiempo.length, 'var(--green)')}
    </div>
    ${cuerpo}
  </section>`;
}
function cardHTML(p, e) {
  e = e || estado(p);
  const ab = findAbogado(p.abogadoId);
  const sub = [p.organo, p.procedimiento].filter(Boolean).join(' · ') || p.cliente || 'Sin datos del juzgado';
  return `<button class="pcard${p.hecho ? ' hecho' : ''}" data-go="plazo" data-id="${p.id}">${badgeHTML(e)}
    <div class="pc-main"><div class="pc-t">${esc(p.actuacion || 'Plazo sin título')}</div><div class="pc-s">${esc(sub)}</div>
    <div class="pc-v t-${e.k}">${e.c ? (e.k === 'hecho' ? 'Hecho · vencía ' + fCorta(e.c.vence) : e.k === 'tiempo' || e.k === 'pronto' ? 'Vence ' + fCorta(e.c.vence) : textoEstado(e)) : ''}${ab ? ` <span style="color:var(--muted)">· ${esc(ab.nombre)}</span>` : ''}</div></div>${I.chev}</button>`;
}

function extractHTML(x) {
  if (x.cargando) return `<div class="found" style="background:var(--surf)"><span class="spin"></span> Leyendo el PDF…</div>`;
  if (x.error) return `<div class="found warn err"><b>No he podido leer el texto.</b> ${esc(x.error)} Rellena los datos a mano, el PDF se guarda igualmente.</div>`;
  const items = [['Juzgado', x.organo], ['Procedimiento', x.procedimiento], ['Partes', x.cliente], ['Resolución', x.resolucion], ['Recibida', x.recepcion ? `${fNum(x.recepcion.fecha)}${x.recepcion.hora ? ' a las ' + x.recepcion.hora : ''}` : ''], ['Plazo', x.plazo ? `${x.plazo.cantidad} ${x.plazo.unidad === 'meses' ? 'meses' : 'días'}` : '']].filter(i => i[1]);
  if (!items.length) return `<div class="found warn"><b>He abierto el PDF pero no encuentro los datos.</b> Puede que sea una imagen escaneada. Rellénalos a mano.</div>`;
  return `<div class="found"><b>✓ He encontrado:</b><br>${items.map(([k, v]) => `${k}: <b style="color:inherit">${esc(v)}</b>`).join('<br>')}
    ${x.plazo && x.plazo.frase ? `<q>«…${esc(x.plazo.frase)}…»</q>` : ''}<div style="margin-top:8px;color:var(--muted)">Revísalo, por si acaso.</div></div>`;
}
function pintaCalculo() {
  const el = $('#calc'); if (!el || !S.draft) return;
  const d = S.draft, c = calcular(d);
  if (!c) { el.innerHTML = `<div class="warn" style="margin-bottom:18px"><b>Falta la fecha</b> de recepción para calcular el plazo.</div>`; return; }
  el.innerHTML = resultHTML(c, d, true);
}
function resultHTML(c, p, abierto) {
  let cmp = '';
  if (c.saltaVacaciones && !p.urgente) { const alt = calcular({ ...p, urgente: true }); if (alt) cmp = `<div class="cmp">Ojo: he descontado días de agosto o de Navidad. Si el asunto fuera urgente, vencería el <b>${fLarga(alt.vence)}</b>.</div>`; }
  const mesesNota = p.unidad === 'meses' ? `<div class="cmp">Los plazos por meses se cuentan de fecha a fecha. Revisa con el abogado si le afecta agosto.</div>` : '';
  return `<div class="result" aria-live="polite"><div class="k">Vence</div><div class="big">${may(fLargaY(c.vence))}</div>
    <div class="g">Y aún puedes presentarlo hasta las <b>15:00 del ${fLarga(c.gracia)}</b>.</div>${cmp}${mesesNota}
    <details${abierto ? ' open' : ''}><summary>${I.right} ¿Cómo lo he calculado?</summary>${pasosHTML(c, p)}</details></div>`;
}

/* ---- calendario ---- */
function vCalendario() {
  const t = hoy();
  if (!S.calDia) S.calDia = t;
  if (!S.calMes) S.calMes = S.calDia.slice(0, 7);
  const [y, m] = S.calMes.split('-').map(Number);
  const primero = `${y}-${pad(m)}-01`, nDias = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const offset = (partes(primero).w + 6) % 7; // semana empieza en lunes
  const porDia = {};
  for (const p of S.plazos) { const e = estado(p); if (e.c) (porDia[e.c.vence] = porDia[e.c.vence] || []).push({ p, e }); }
  let celdas = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(w => `<div class="wd">${w}</div>`).join('') + '<div></div>'.repeat(offset);
  for (let d = 1; d <= nDias; d++) {
    const s = `${y}-${pad(m)}-${pad(d)}`, inh = inhabil(s, false), its = porDia[s] || [];
    celdas += `<button class="day${inh ? ' inh' : ''}${s === t ? ' today' : ''}${s === S.calDia ? ' sel' : ''}" data-act="dia" data-d="${s}" aria-label="${fLarga(s)}${inh ? ', inhábil' : ''}${its.length ? ', ' + its.length + ' plazos' : ''}">${d}${its.length ? `<span class="dots">${its.slice(0, 3).map(x => `<i style="background:${COLOR[x.e.k]}"></i>`).join('')}</span>` : ''}</button>`;
  }
  // tira de días (como la del diseño): dos semanas alrededor del día elegido
  let pills = '';
  for (let i = -3; i <= 14; i++) {
    const s = addDias(S.calDia, i), q = partes(s), its = porDia[s] || [], pend = its.filter(x => x.e.k !== 'hecho');
    pills += `<button class="pill${inhabil(s, false) ? ' inh' : ''}${s === S.calDia ? ' sel' : ''}" data-act="dia" data-d="${s}" aria-label="${fLarga(s)}">${pend.length ? `<i class="pd" style="background:${COLOR[pend[0].e.k]}"></i>` : ''}${q.d}<small>${MESES_C[q.m - 1]}</small></button>`;
  }
  const delDia = (porDia[S.calDia] || []).sort((a, b) => a.p.hecho - b.p.hecho);
  const motivo = inhabil(S.calDia, false);
  return `<section class="hero compact">${topbar('Calendario', { menu: true })}${waveSVG()}</section>
  <section class="sec" style="padding-bottom:6px">
    <div class="mhead"><button class="rbtn" data-act="mes" data-n="-1" aria-label="Mes anterior">${I.left}</button><h2>${may(MESES[m - 1])} ${y}</h2><button class="rbtn" data-act="mes" data-n="1" aria-label="Mes siguiente">${I.right}</button></div>
    <div class="grid">${celdas}</div>
    <div class="legend"><span><i style="background:var(--red)"></i>Urgente</span><span><i style="background:var(--amber)"></i>Próximo</span><span><i style="background:var(--green)"></i>Con tiempo</span><span><i class="hatch"></i>Inhábil</span></div>
  </section>
  <svg class="wave-up" viewBox="0 0 400 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0 64 C0 34 16 22 60 20 L330 16 C374 14 400 8 400 0 L400 64 Z"/></svg>
  <section class="dark-sec">
    <div class="pills" role="list">${pills}</div>
    <div class="dsec"><h3>${may(fLargaY(S.calDia))}</h3>
      <div class="why">${motivo ? 'Día inhábil · ' + esc(motivo) : 'Día hábil'}${delDia.length ? ` · vence${delDia.length > 1 ? 'n' : ''} ${delDia.length}` : ''}</div>
      ${delDia.length ? delDia.map(({ p, e }) => `<button class="dcard" data-go="plazo" data-id="${p.id}">${badgeHTML(e)}<div class="pc-main"><div class="pc-t">${esc(p.actuacion || 'Plazo')}</div><div class="pc-s">${esc([p.organo, p.procedimiento].filter(Boolean).join(' · '))}</div></div>${I.chev}</button>`).join('') : `<div class="why" style="margin-top:6px">No vence ningún plazo este día.</div>`}
    </div>
    <div style="height:12px"></div>
  </section>`;
}

      await savePlazo(plazo); pdfPendiente = null; S.draft = null;
      toast(_edit ? 'Cambios guardados' : 'Plazo guardado');
      return go({ name: 'plazo', id: plazo.id }, true);
    }
    case 'hecho': p.hecho = !p.hecho; p.hechoEn = p.hecho ? Date.now() : null; await savePlazo(p); toast(p.hecho ? '¡Hecho! Bien' : 'Vuelve a estar pendiente'); return render();
    case 'borrar': if (!(await confirmar('¿Borrar este plazo?', 'No se puede deshacer.', 'Borrar'))) return; await Store.del(p.id); await Store.delPDF(p.id).catch(() => {}); S.plazos = S.plazos.filter(x => x.id !== p.id); toast('Plazo borrado'); return go({ name: 'home' }, true);
    case 'avisar': return avisarSheet(p);
    case 'verPdf': {
      if (!p.pdfName) return toast('Este plazo no tiene PDF. Puedes añadirlo creando una notificación nueva.');
      const x = await Store.getPDF(p.id); if (!x) return toast('No encuentro el PDF');
      const url = URL.createObjectURL(x.blob); const w = window.open(url, '_blank'); if (!w) await deliver(x.blob, x.name || 'notificacion.pdf'); setTimeout(() => URL.revokeObjectURL(url), 60000); return;
    }
    case 'ics': return deliver(new Blob([icsArchivo([icsEvento(p)])], { type: 'text/calendar' }), `plazo-${(p.procedimiento || p.actuacion || 'plazo').replace(/[^\w-]+/g, '-')}.ics`);
    case 'icsTodos': { const ps = S.plazos.filter(x => !x.hecho); if (!ps.length) return toast('No hay plazos pendientes'); return deliver(new Blob([icsArchivo(ps.map(icsEvento))], { type: 'text/calendar' }), `mis-plazos-${hoy()}.ics`); }
    case 'dia': S.calDia = b.dataset.d; S.calMes = S.calDia.slice(0, 7); return render();
    case 'mes': { const [y, m] = S.calMes.split('-').map(Number); const nd = new Date(Date.UTC(y, m - 1 + Number(b.dataset.n), 1)); S.calMes = fromD(nd).slice(0, 7); S.calDia = S.calMes === hoy().slice(0, 7) ? hoy() : S.calMes + '-01'; return render(); }
    case 'festYear': S.festYear = (S.festYear || +hoy().slice(0, 4)) + Number(b.dataset.n); return render();
    case 'addFest': case 'quickFest': {
      const f = act === 'quickFest' ? b.dataset.d : $('#fe-d').value, n = act === 'quickFest' ? b.dataset.n : $('#fe-n').value.trim();
      if (!validFecha(f)) return toast('Elige la fecha');
      if (S.festivos.some(x => x.fecha === f) || nacionalDe(f)) return toast('Ese día ya es festivo');
      S.festivos.push({ fecha: f, nombre: n || 'Festivo local' }); await saveKV('festivos'); toast('Festivo añadido'); return render();
    }
    case 'delFest': S.festivos = S.festivos.filter(x => x.fecha !== b.dataset.d); await saveKV('festivos'); return render();
    case 'guardarPerfil': S.perfil.nombre = $('#pf-n').value.trim(); S.perfil.firma = $('#pf-f').value.trim(); await saveKV('perfil'); toast('Guardado'); return back();
    case 'exportar': return exportar();
    case 'importar': return $('#impIn').click();
    case 'instalar': closeOverlay(); return instalarSheet();
    case 'actualizar': {
      closeOverlay(); if (!swReg) return toast('Ya tienes la última versión');
      toast('Buscando…'); try { await swReg.update(); } catch { } setTimeout(() => { if (!recargando) toast('Ya tienes la última versión (' + VERSION + ')'); }, 2500); return;
    }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.query = el.value; const pos = el.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch { } } return; }
  const f = el.dataset && el.dataset.f; if (!f || !S.draft) return;
  S.draft[f] = el.value;
  if (f === 'cantidad' || f === 'actuacion') document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.n === S.draft.actuacion && +x.dataset.d === Number(S.draft.cantidad) && S.draft.unidad === 'dias'));
  if (f === 'recepcion' || f === 'cantidad') pintaCalculo();
});
document.addEventListener('change', e => {
  if (e.target.id === 'pdfIn') onPDF(e.target.files[0]);
  if (e.target.id === 'impIn' && e.target.files[0]) importar(e.target.files[0]);
});

/* ---------- arranque ---------- */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('App instalada'); });
(async function init() {
  try {
    S.plazos = (await Store.all()) || [];
    S.abogados = (await Store.getKV('abogados')) || [];
    S.festivos = (await Store.getKV('festivos')) || [];
    const pf = await Store.getKV('perfil'); if (pf) S.perfil = { ...S.perfil, ...pf };
  } catch (err) { console.error(err); toast('No se pudieron cargar los datos guardados'); }
  history.replaceState({ name: 'home' }, ''); render();
  if (!S.perfil.visto && !S.plazos.length) bienvenida();
  if (window.claude && typeof window.claude.use === 'function') { try { downloadsNS = await window.claude.use('downloads'); } catch { downloadsNS = null; } }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !enArtefacto()) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      swReg = reg;
      if (reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('skipWaiting'); }); });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
    // Cuando entra una versión nueva se recarga sola, salvo si está a medias rellenando una notificación.
    // La primera vez que se abre la app no había versión anterior: ahí no se recarga (perdería lo que se esté escribiendo).
    const habiaVersion = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!habiaVersion || recargando || S.view.name === 'nuevo' || $('#ov').innerHTML) return; recargando = true; location.reload(); });
  }
  // Al volver a la app otro día, los estados (hoy, próximos…) se recalculan
  let dia = hoy();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && hoy() !== dia) { dia = hoy(); if (S.view.name !== 'nuevo') render(); } });
})();
</script>
</body>
